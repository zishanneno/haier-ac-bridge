name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Verify fresh launcher installation, restart, and shutdown
        run: node --test test/launcher.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node --check web/app.js
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t haier-ac-bridge:ci .
      - name: Verify clean container startup
        run: |
          docker run -d --name bridge-ci -p 127.0.0.1:8787:8787 --read-only --tmpfs /tmp -v bridge-ci-data:/app/data haier-ac-bridge:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health; then exit 0; fi
            sleep 2
          done
          docker logs bridge-ci
          exit 1
      - name: Cleanup
        if: always()
        run: |
          docker rm -f bridge-ci || true
          docker volume rm bridge-ci-data || true
